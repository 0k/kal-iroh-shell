[package]
name = "kal-iroh-shell"
description = "Client shell: serve an app's interface from its server's published releases and reload it, state saved, when a new one is published"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Execute shell commands on a Tauri webview window.
tauri = ["dep:tauri"]

[dependencies]
kal-iroh-shell-protocol.workspace = true
axum.workspace = true
futures.workspace = true
log.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", optional = true }

[dev-dependencies]
kal-iroh-shell-server.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
serde_json.workspace = true
reqwest.workspace = true
futures.workspace = true
